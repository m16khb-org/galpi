# `rust-version` in src-tauri/Cargo.toml is the enforced MSRV (1.88 for
# let-chains); this file only guarantees the components and target every gate
# needs, so it tracks stable instead of pinning a single compiler build.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
