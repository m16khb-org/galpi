name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      # `secrets` is not available in `if:`, so presence is exposed as flags.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: cargo install tauri-cli --version 2.11.4 --locked

      # Signing and notarization are what let a recipient open the app without
      # being told it is damaged. The build still succeeds without these
      # secrets, producing an ad-hoc signed DMG for internal testing only.
      - name: Import the signing certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Build the DMG
        env:
          # Empty when the secrets are absent, which leaves tauri on its
          # existing ad-hoc identity.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run build

      - name: Confirm the bundle passes Gatekeeper
        if: env.HAS_APPLE_SIGNING_IDENTITY == 'true'
        run: |
          set -euo pipefail
          APP=src-tauri/target/release/bundle/macos/Galpi.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          # A notarized build is stapled; this is what a recipient's Mac checks.
          spctl --assess --type execute --verbose=4 "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: galpi-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  nsis:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: galpi-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
