name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # The app ships for arm64 macOS 14+, x64 Windows and x64 Linux, so the
    # gates run on the platforms they describe.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]
        include:
          - os: macos-15
            target_args: ""
          - os: windows-latest
            target_args: "--target x86_64-pc-windows-msvc"
          - os: ubuntu-24.04
            target_args: "--target x86_64-unknown-linux-gnu"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The frontend build output is what tauri.conf.json points `frontendDist`
      # at; without it the Tauri context macro fails to expand.
      - run: bun install --frozen-lockfile
      - run: bun run vite:build
      # tauri.conf.json bundles `binaries/uv` and `resources/worker`, which are
      # generated rather than committed; the build script fails without them.
      # `cargo tauri dev/build` stage them through before*Command, plain cargo
      # does not.
      - run: bun run sidecar:stage
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets ${{ matrix.target_args }} -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets ${{ matrix.target_args }}

  worker:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check worker
      - run: uvx ruff format --check worker
      # The pure helpers import no ML stack, so they run on a bare interpreter.
      - run: PYTHONPATH=. uv run --python 3.12 python -m unittest discover -s worker/tests -t . -v

  windows-engine:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run vite:build
      - run: bun run sidecar:stage
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .engine-venv
      - run: uv pip install --python .engine-venv/Scripts/python.exe -r worker/requirements-windows-cpu.lock --require-hashes
      - run: .engine-venv/Scripts/python.exe -c "import whisperx, torch, pyannote.audio"
      - name: Worker environment starts the engine Python
        run: |
          GALPI_TEST_PYTHON="$(pwd -W)/.engine-venv/Scripts/python.exe" \
            cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc -- --ignored windows_worker_environment_starts_python
      # Resolve-only: proves the CUDA lock still resolves without pulling the
      # multi-GB wheels.
      - run: uv pip install --python .engine-venv/Scripts/python.exe --dry-run -r worker/requirements-windows-cuda.lock --require-hashes --index-strategy unsafe-best-match

  bundle-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - run: bun run build
      - name: Assert the NSIS installer exists
        run: ls src-tauri/target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: galpi-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  windows-install-smoke:
    needs: bundle-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: galpi-nsis
          path: installer
      - name: Install and verify the engine
        shell: pwsh
        run: |
          $installer = (Get-ChildItem installer -Filter *.exe | Select-Object -First 1).FullName
          & pwsh -File scripts/ci/windows-install-smoke.ps1 -Installer $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Every committed platform lock must still reproduce from requirements.txt.
  locks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lock: [windows-cpu, windows-cuda, linux-cpu, linux-cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: python3 scripts/verify-lock.py ${{ matrix.lock }}

  linux-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .engine-venv
      - run: uv pip install --python .engine-venv/bin/python -r worker/requirements-linux-cpu.lock --require-hashes --index-strategy unsafe-best-match
      - run: .engine-venv/bin/python -c "import whisperx, torch, pyannote.audio"
      # Resolve-only: proves the CUDA lock still resolves without pulling the
      # multi-GB wheels.
      - run: uv pip install --python .engine-venv/bin/python --dry-run -r worker/requirements-linux-cuda.lock --require-hashes

  bundle-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - run: bun run build
      - name: Assert the deb and AppImage exist
        run: |
          ls src-tauri/target/release/bundle/deb/*.deb
          ls src-tauri/target/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: galpi-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
