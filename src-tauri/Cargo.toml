[package]
name = "galpi"
version = "0.1.0"
description = "Local Korean meeting transcription desktop app"
authors = ["m16khb <m16khb@gmail.com>"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "galpi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18.2"
dunce = "1"
getrandom = "0.4"
hound = "3.5.1"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[dev-dependencies]
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
# Test-only RS256 key pair, generated once per test run so no private key is committed.
rand = "0.8"
rsa = "0.9"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_JobObjects",
  "Win32_System_Power",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# Release builds strip symbols and link with full LTO in a single codegen unit.
# `panic` stays at the default unwind: aborting would turn a panic in the audio
# writer thread into a lost recording instead of a failed one.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
